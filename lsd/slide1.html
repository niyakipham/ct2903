<html lang="vi">
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>REQUIEM // EXTRACTED</title> 
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script> 
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* === REQUIEM EXTRACTED THEME === */
:root {
    --bg-color: #0b0c10; 
    --text-main: #d0d0d0; 
    --accent-white: #ffffff;
    --border-thin: rgba(255, 255, 255, 0.15);
    
    --font-display: 'Cinzel', serif; 
    --font-mono: 'Space Mono', monospace;
    --font-body: 'Inter', sans-serif;
    
    --error: #cf6679;
    --texture: url('data:image/svg+xml;utf8,<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><filter id="noiseFilter"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23noiseFilter)" opacity="0.05"/></svg>');
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: var(--font-body); background-color: var(--bg-color); color: var(--text-main);
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; 
    font-size: 1rem; line-height: 1.8; position: relative; overflow-x: hidden; padding: 2rem 1rem;
}
body::before { 
    content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
    background-image: var(--texture); pointer-events: none; z-index: -2; 
}

.decor-cross { position: absolute; width: 10px; height: 10px; pointer-events: none; opacity: 0.3; }
.decor-cross::before, .decor-cross::after { content: ''; position: absolute; background: var(--accent-white); }
.decor-cross::before { top: 4px; left: 0; width: 100%; height: 1px; }
.decor-cross::after { top: 0; left: 4px; width: 1px; height: 100%; }

/* Container */
.container {
    max-width: 900px; width: 100%; margin: 0 auto; position: relative; z-index: 10;
}
.top-decor {
    text-align: center; font-size: 0.65rem; font-family: var(--font-mono); letter-spacing: 4px; 
    opacity: 0.5; margin-bottom: 4rem; display: flex; justify-content: space-between; text-transform: uppercase;
}

/* === THE GATE (Password Section) === */
#final-password-section { 
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh;
}
.gate-arch {
    border: 1px solid var(--border-thin); border-bottom: none;
    border-radius: 50vw 50vw 0 0; /* Perfect Arch */
    padding: 6rem 4rem 3rem 4rem;
    background: linear-gradient(to bottom, rgba(255,255,255,0.02), transparent);
    text-align: center; position: relative; max-width: 450px; width: 100%;
}
.gate-arch::after {
    content: ''; position: absolute; bottom: 0; left: -15%; width: 130%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
}
h1.page-title { 
    font-family: var(--font-display); color: var(--accent-white); font-weight: 400; 
    letter-spacing: 12px; text-transform: uppercase; font-size: 2.5rem; margin-bottom: 3rem; 
    text-shadow: 0 0 20px rgba(255,255,255,0.2); margin-left: 6px;
}
.password-form { display: flex; flex-direction: column; gap: 2rem; width: 100%; }
input[type=password] { 
    width: 100%; padding: 1rem; background: transparent; 
    border: none; border-bottom: 1px solid var(--border-thin);
    color: var(--accent-white); font-family: var(--font-mono); text-align: center; 
    letter-spacing: 5px; outline: none; transition: border-color 0.3s;
}
input[type=password]:focus { border-color: var(--accent-white); }
button.submit-btn { 
    background: transparent; color: var(--accent-white); border: 1px solid var(--border-thin); 
    padding: 1rem; cursor: pointer; font-family: var(--font-mono); font-weight: normal; 
    text-transform: uppercase; letter-spacing: 4px; transition: all 0.5s; font-size: 0.8rem;
}
button.submit-btn:hover { background: var(--accent-white); color: var(--bg-color); letter-spacing: 6px; }
.error-msg { color: var(--error); font-size: 0.75rem; font-family: var(--font-mono); letter-spacing: 1px; display: none; margin-top: -1rem; }
.error-msg.show { display: block; animation: shake 0.4s ease; }
@keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-5px);} 75%{transform:translateX(5px);} }

/* === EXTRACTED CONTENT === */
#final-content-section { display: none; padding-top: 2rem; }
#final-content-section.visible { display: block; animation: reveal 2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes reveal { from { opacity: 0; transform: translateY(30px); filter: blur(5px); } to { opacity: 1; transform: translateY(0); filter: blur(0); } }

/* Tri-Arch Layout (The Masterpiece) */
#embedded-images-container { display: flex; gap: 2%; margin-bottom: 4rem; justify-content: center; }
#embedded-images-container.layout-grid { flex-direction: row; align-items: flex-end; height: 60vh; min-height: 400px; }
#embedded-images-container.layout-grid .img-item { 
    flex: 1; height: 90%; position: relative; overflow: hidden;
    border: 1px solid var(--border-thin); border-bottom: none;
    border-radius: 50vw 50vw 0 0; /* Architectural Arch */
    background: rgba(255,255,255,0.02);
    transition: filter 0.8s, transform 0.8s, height 0.8s;
}
#embedded-images-container.layout-grid .img-item:nth-child(2) { height: 100%; transform: translateY(-5%); flex: 1.2; }
#embedded-images-container.layout-grid .img-item img {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
    filter: grayscale(40%) contrast(1.1) brightness(0.8); transition: all 0.8s;
}
#embedded-images-container.layout-grid .img-item:hover { z-index: 2; }
#embedded-images-container.layout-grid .img-item:hover img { filter: grayscale(0%) contrast(1.1) brightness(1); transform: scale(1.05); }

#embedded-images-container.layout-column { flex-direction: column; align-items: center; gap: 2rem; }
#embedded-images-container.layout-column .img-item { width: 100%; border: 1px solid var(--border-thin); padding: 0.5rem; }
#embedded-images-container.layout-column img { width: 100%; display: block; filter: grayscale(20%); }

#embedded-images-container.layout-comic { flex-direction: column; gap: 0; }
#embedded-images-container.layout-comic .img-item img { width: 100%; display: block; border: none; }

/* Typography & Markdown */
.markdown-body { 
    max-width: 750px; margin: 0 auto; color: var(--text-main); 
    font-weight: 300; text-align: justify;
}
.markdown-body h1, .markdown-body h2, .markdown-body h3 { 
    font-family: var(--font-display); color: var(--accent-white); 
    margin-top: 4rem; margin-bottom: 2rem; font-weight: 400; letter-spacing: 4px; text-align: center;
}
.markdown-body h1 { font-size: 2.8rem; text-transform: uppercase; }
.markdown-body h1::after { content: ''; display: block; width: 40px; height: 1px; background: var(--accent-white); margin: 1.5rem auto 0; }
.markdown-body h2 { font-size: 2rem; }
.markdown-body p { margin-bottom: 1.5rem; }

/* Bổ sung List (ul, ol, li) */
.markdown-body ul, .markdown-body ol { margin: 1.5rem 0 1.5rem 2rem; }
.markdown-body li { margin-bottom: 0.8rem; padding-left: 0.5rem; }
.markdown-body li::marker { color: var(--text-muted); font-family: var(--font-mono); }

/* Bổ sung Table (Bảng biểu phong cách Tech-Noir) */
.markdown-body table { 
    width: 100%; border-collapse: collapse; margin: 3rem 0; 
    font-family: var(--font-body); font-size: 0.95rem; 
    background: rgba(255,255,255,0.01); 
    border: 1px solid var(--border-thin); 
}
.markdown-body th, .markdown-body td { 
    border: 1px solid var(--border-thin); padding: 1.2rem; text-align: left; 
}
.markdown-body th { 
    font-family: var(--font-mono); text-transform: uppercase; 
    letter-spacing: 2px; color: var(--accent-white); 
    font-weight: normal; background: rgba(255,255,255,0.04); 
}
.markdown-body tr:nth-child(even) { background: rgba(255,255,255,0.02); }
.markdown-body tr:hover { background: rgba(255,255,255,0.07); transition: background 0.3s ease; }

/* Bổ sung Text Decor (Bold, Italic, HR) */
.markdown-body strong { color: var(--accent-white); font-weight: 600; letter-spacing: 0.5px; }
.markdown-body em { color: var(--text-muted); font-style: italic; }
.markdown-body hr { border: 0; height: 1px; background: var(--border-thin); margin: 3rem auto; width: 40%; }

.markdown-body a { color: var(--accent-white); text-decoration: none; border-bottom: 1px solid var(--border-thin); transition: border-color 0.3s; }
.markdown-body a:hover { border-color: var(--accent-white); }
.markdown-body blockquote { 
    border-left: 1px solid var(--accent-white); padding-left: 2rem; font-style: italic; 
    margin: 3rem 0; opacity: 0.8; font-family: var(--font-display); font-size: 1.3rem; letter-spacing: 1px;
}
.markdown-body pre { 
    background: rgba(255,255,255,0.03); padding: 1.5rem; border: 1px solid var(--border-thin); 
    overflow-x: auto; margin: 2rem 0; font-family: var(--font-mono); font-size: 0.85rem;
}
.markdown-body code { font-family: var(--font-mono); background: rgba(255,255,255,0.05); padding: 0.2em 0.4em; }

/* Study Mode (Classified File Aesthetic) */
.markdown-body.study-mode .study-question { 
    border-top: 1px solid var(--border-thin); border-bottom: 1px solid var(--border-thin);
    padding: 1.5rem 0; margin: 2.5rem 0 1rem 0; font-family: var(--font-display); font-size: 1.2rem;
    color: var(--accent-white); letter-spacing: 1px;
}
.markdown-body.study-mode .study-answer { 
    padding: 1rem 0 1rem 2.5rem; margin-bottom: 0.5rem; cursor: pointer; color: var(--text-main); 
    position: relative; transition: color 0.3s; font-family: var(--font-mono); font-size: 0.9rem;
}
.markdown-body.study-mode .study-answer:hover { color: var(--accent-white); }
.markdown-body.study-mode .study-answer::before { 
    content: '[ + ]'; position: absolute; left: 0; color: var(--border-thin); 
}
.markdown-body.study-mode .study-explanation { 
    display: none; padding: 1.5rem; color: var(--text-muted); 
    background: rgba(255,255,255,0.02); border-left: 2px solid var(--accent-white); 
    margin-left: 2.5rem; margin-bottom: 2rem; font-size: 0.95rem; font-style: italic;
}
.markdown-body.study-mode .study-explanation.visible { display: block; animation: fadeIn 0.5s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }

/* Media */
#embedded-iframes-container { display: flex; flex-direction: column; gap: 4rem; margin-top: 5rem; }
.iframe-wrapper { position: relative; width: 100%; padding-top: 56.25%; border: 1px solid var(--border-thin); background: #000; }
.iframe-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; filter: grayscale(30%); transition: filter 0.8s; }
.iframe-wrapper iframe:hover { filter: grayscale(0%); }

/* Footer */
.footer-decor {
    margin-top: 8rem; padding-top: 2rem; border-top: 1px solid var(--border-thin);
    display: flex; justify-content: space-between; align-items: flex-end;
    font-size: 0.65rem; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 2px; opacity: 0.5;
}
.barcode {
    font-family: 'Libre Barcode 39', cursive, monospace; font-size: 2.5rem; letter-spacing: 0;
    background: repeating-linear-gradient(90deg, var(--accent-white), var(--accent-white) 1px, transparent 1px, transparent 3px, var(--accent-white) 3px, var(--accent-white) 4px, transparent 4px, transparent 6px);
    color: transparent; width: 120px; height: 30px; opacity: 0.8; margin-bottom: 0.5rem;
}

#expiration-message { 
    display: none; text-align: center; color: var(--error); font-family: var(--font-mono); 
    font-size: 0.8rem; letter-spacing: 4px; border: 1px solid var(--error); padding: 1.5rem; 
    background: rgba(207, 102, 121, 0.05); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 90%; max-width: 500px;
}
body.expired .container { display: none; }
body.expired #expiration-message { display: block; }

@media (max-width: 768px) {
    #embedded-images-container.layout-grid { height: auto; flex-direction: column; }
    #embedded-images-container.layout-grid .img-item { border-radius: 0; border: 1px solid var(--border-thin); padding: 0.5rem; height: auto;}
    #embedded-images-container.layout-grid .img-item img { position: relative; height: auto; filter: grayscale(0%);}
    #embedded-images-container.layout-grid .img-item:nth-child(2) { transform: none; }
    h1.page-title { font-size: 2rem; letter-spacing: 8px; }
    .gate-arch { padding: 3rem 1.5rem; border-radius: 0; border-top: 1px solid var(--border-thin); }
    .footer-decor { flex-direction: column; gap: 2rem; align-items: center; text-align: center; }
}
</style>
</head>

        const layoutMode = `normal`;
        const imgLayout = `grid`;
        const imgUrls = [];
        const frameUrls = [];
        const expiry = null;

        const body = document.getElementById('target-body');
        const passSec = document.getElementById('final-password-section');
        const contSec = document.getElementById('final-content-section');
        const passInp = document.getElementById('pass-input');
        const err = document.getElementById('error-msg');
        const mdCont = document.getElementById('markdown-content');
        const imgCont = document.getElementById('embedded-images-container');
        const frameCont = document.getElementById('embedded-iframes-container');

        function isExpired() {
            if (!expiry) return false;
            try { const d = new Date(expiry.year, expiry.month - 1, expiry.day, expiry.hour, expiry.minute, 0); return new Date() > d; }
            catch(e) { return false; }
        }

        function multiDecrypt(data, pass, layers=10) {
            let curr = data;
            try {
                for (let i = layers - 1; i >= 0; i--) {
                    const key = pass + i;
                    const bytes = CryptoJS.AES.decrypt(curr, key);
                    const utf8 = bytes.toString(CryptoJS.enc.Utf8);
                    if (!utf8 && i>0) throw new Error('fail');
                    if (utf8) {
                        const parts = utf8.split("|");
                        if (parts.length < 3 || parts[parts.length-2] !== pass) throw new Error('fail');
                        curr = parts.slice(0, parts.length-2).join('|');
                    } else curr = "";
                } return curr;
            } catch(e) { throw new Error('fail'); }
        }

        function processStudyMode() {
            if(layoutMode !== 'study') return;
            mdCont.classList.add('study-mode');
            const children = Array.from(mdCont.children);
            let qCount = 0; let lastQ = null; let lastA = null;

            children.forEach((el, i) => {
                const isIndented = /^\s{4,}/.test(el.innerHTML);
                const hasStrong = el.querySelector(':scope > strong:only-child');
                const isOnlyStrong = hasStrong && hasStrong.textContent.trim() === el.textContent.trim();
                const isExp = el.querySelector(':scope > em > strong') || (el.tagName === 'LI' && el.querySelector(':scope > em > strong'));

                if(el.tagName === 'P' && isOnlyStrong && !isIndented) {
                    el.classList.add('study-question'); lastQ = el; lastA = null;
                } else if(lastQ && isIndented && isOnlyStrong) {
                    el.classList.add('study-answer'); qCount++;
                    const expId = 'exp-'+qCount; el.dataset.target = expId; lastA = el;
                    el.addEventListener('click', function() {
                        const tgt = document.getElementById(this.dataset.target);
                        if(tgt) tgt.classList.toggle('visible');
                    });
                } else if(lastA && isExp) {
                    el.classList.add('study-explanation'); el.id = lastA.dataset.target;
                }
            });
        }

        function render(html) {
            imgCont.className = 'layout-' + imgLayout;
            imgUrls.forEach(url => {
                const div = document.createElement('div'); div.className = 'img-item';
                div.innerHTML = `<img src="${url}" onerror="this.style.display='none'">`;
                imgCont.appendChild(div);
            });
            
            mdCont.innerHTML = html;
            processStudyMode();

            frameUrls.forEach(url => {
                const w = document.createElement('div'); w.className = 'iframe-wrapper';
                w.innerHTML = `<iframe src="${url}" allowfullscreen loading="lazy"></iframe>`;
                frameCont.appendChild(w);
            });
        }

        function checkPass(e) {
            e.preventDefault();
            const p = passInp.value.trim();
            err.classList.remove('show');
            try {
                const html = multiDecrypt(encryptedData, p);
                render(html);
                passSec.style.display = 'none';
                contSec.classList.add('visible');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } catch(ex) {
                err.classList.add('show'); passInp.value = '';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(isExpired()) { body.classList.add('expired'); }
        });
    </script>
